info:
  name: Sell Stock | V1
  type: http
  seq: 2

http:
  method: POST
  url: "{{INVESTMENT_TRACKER_SERVICE}}/api/v1/me/portfolio/transaction"
  body:
    type: json
    data: |-
      {
        "stockCode": "A",
        "stockName": "Dummy Stock",
        "exchangeName": "NSE",
        "brokerName": "ZERODHA",
        "price": 1000,
        "quantity": 10,
        "assetType": "EQUITY",
        "transactionType": "SELL",
        "transactionDate": "2025-07-01",
        "brokerCharges": 10
