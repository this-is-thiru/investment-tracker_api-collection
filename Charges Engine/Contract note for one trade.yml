info:
  name: Contract note for one trade
  type: http
  seq: 3

http:
  method: GET
  url: "{{INVESTMENT_TRACKER_SERVICE}}/user-charges/user/:email/transaction/:transactionId"
  params:
    - name: email
      value: "{{EMAIL}}"
      type: path
    - name: transactionId
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **Purpose:**
  The full breakdown for one trade, line by line, in the order the charges were applied — tax last,
  because tax is a percentage of the lines above it.

  Each line carries the rate and the base it was applied to, not merely the result, so a stored
  charge can be re-derived and audited rather than taken on trust.

  **Endpoint:**
  `GET {{INVESTMENT_TRACKER_SERVICE}}/user-charges/user/:email/transaction/:transactionId`

  Answers 400 with a readable message when no charge was recorded for that transaction.
