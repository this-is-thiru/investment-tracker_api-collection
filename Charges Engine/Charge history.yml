info:
  name: Charge history
  type: http
  seq: 2

http:
  method: GET
  url: "{{INVESTMENT_TRACKER_SERVICE}}/user-charges/user/:email?from=2025-04-01&to=2025-06-30&assetType=EQUITY"
  params:
    - name: email
      value: "{{EMAIL}}"
      type: path
    - name: from
      value: "2025-04-01"
      type: query
    - name: to
      value: "2025-06-30"
      type: query
    - name: assetType
      value: "EQUITY"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **Purpose:**
  What a user was actually charged, newest first. Distinct from `/user-broker-charges`, which reads
  the superseded implementation's documents — both are live until the Phase C cutover.

  **Endpoint:**
  `GET {{INVESTMENT_TRACKER_SERVICE}}/user-charges/user/:email`

  **Query parameters (all optional):**
  - `from` and `to` — inclusive, `yyyy-MM-dd`. **Both or neither**: a half-open range is rejected with
    400 rather than interpreted, because guessing which end was meant returns a short list that looks
    like missing charges
  - `assetType` — `EQUITY`, `MUTUAL_FUND`, and so on
