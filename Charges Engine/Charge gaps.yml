info:
  name: Charge gaps
  type: http
  seq: 4

http:
  method: GET
  url: "{{INVESTMENT_TRACKER_SERVICE}}/user-charges/user/:email/gaps"
  params:
    - name: email
      value: "{{EMAIL}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **Purpose:**
  Trades whose charges could not be fully assessed — no rate card covering the period
  (`NO_SCHEDULE`), no instrument profile where one was required (`NO_INSTRUMENT_PROFILE`), or a
  provisional computation (`PROVISIONAL`).

  A row is written even when nothing is charged, carrying the reason. Backfilling several years
  crosses periods with no card on file, and a warning in a log scrolls away long before anyone
  notices the portfolio is quietly under-costed. This endpoint is that gap made visible.

  **Endpoint:**
  `GET {{INVESTMENT_TRACKER_SERVICE}}/user-charges/user/:email/gaps`
