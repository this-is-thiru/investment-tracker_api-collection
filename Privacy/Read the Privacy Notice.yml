info:
  name: Read the Privacy Notice
  type: http
  seq: 1

http:
  method: GET
  url: "{{INVESTMENT_TRACKER_SERVICE}}/privacy"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  The privacy notice as a page, public: open it in a browser before signing in (W-247; DPDP Rules r.14(1), r.9).
  The same notice as JSON is `GET /privacy/rights`.
