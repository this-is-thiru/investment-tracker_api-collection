info:
  name: Request Erasure of the Account
  type: http
  seq: 2

http:
  method: POST
  url: "{{INVESTMENT_TRACKER_SERVICE}}/privacy/erasure/user/:email"
  params:
    - name: email
      value: "{{EMAIL}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Take your copy first: once asked, nothing in the account can be read (W-237d). Download the portfolio's assets and
  transactions (`POST /portfolio/user/{email}/stocks/download`, the only part that can be downloaded) and read each
  tax-planning profile's drafts, revisions and computations. The account is erased a year after the request (W-247 C2a).
