info:
  name: Request Erasure of the Account
  type: http
  seq: 2

http:
  method: POST
  url: "{{INVESTMENT_TRACKER_SERVICE}}/privacy/erasure/user/:email"
  params:
    - name: email
      value: "{{EMAIL}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Take your copy first: once asked, nothing in the account can be read (W-237d). Download the portfolio's assets and
  transactions (`POST /portfolio/user/{email}/stocks/download`), and for each tax-planning profile list its computations
  (`GET /tax/user/{email}/profiles/{profileId}/computations`) and take each one's PDF report by its receipt
  (`GET /tax/user/{email}/computations/{receipt}/report`); read its drafts and revisions too (W-123b). The account is erased a year after the request (W-247 C2a).
  Asking also withdraws your consent (W-250 C3a; DPDP Act s.6(4)): all processing stops at once.
