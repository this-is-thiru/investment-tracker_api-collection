info:
  name: Request Erasure of the Account
  type: http
  seq: 2

http:
  method: POST
  url: "{{INVESTMENT_TRACKER_SERVICE}}/api/v1/me/privacy/erasure"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Take your copy first: once asked, nothing in the account can be read (W-237d). Download the portfolio's assets and
  transactions (`POST /api/v1/me/portfolio/stocks/download`), and for each tax-planning profile list its computations
  (`GET /api/v1/me/tax/profiles/{profileId}/computations`) and take each one's PDF report by its receipt
  (`GET /api/v1/me/tax/computations/{receipt}/report`); read its drafts and revisions too (W-123b). The account is erased a year after the request (W-247 C2a).
  Asking also withdraws your consent (W-250 C3a; DPDP Act s.6(4)): all processing stops at once.
