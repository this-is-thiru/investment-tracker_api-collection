info:
  name: Read the Privacy Notice as JSON
  type: http
  seq: 3

http:
  method: GET
  url: "{{INVESTMENT_TRACKER_SERVICE}}/privacy/rights"

runtime:
  scripts:
    - type: after-response
      code: |-
        let body = res.getStatus() != 200 ? null : res.getBody();
        bru.setEnvVar('PRIVACY_NOTICE_VERSION', body?.data?.version);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  The privacy notice as JSON, public (W-237a; DPDP Rules r.14(1), r.9). It is also the notice before consent (W-250; Act
  s.5(1), Rules r.3): the personal data held, item by item, the purpose, how to withdraw consent and how to complain to the
  Board. `version` identifies this exact wording; the script stores it as `{{PRIVACY_NOTICE_VERSION}}`, which
  *Auth / Register User* sends back. Run this first: registration is refused without the current version.
