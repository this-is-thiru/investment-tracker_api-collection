info:
  name: Report of a Computation
  type: http
  seq: 17

http:
  method: GET
  url: "{{INVESTMENT_TRACKER_SERVICE}}/tax/user/:email/computations/:receipt/report"
  params:
    - name: email
      value: "{{EMAIL}}"
      type: path
    - name: receipt
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  One stored computation as a PDF (application/pdf), made on request and kept nowhere (F10, W-123a). It prints what
  was stored and shown, never recomputed: the receipt, tax year, total income and amount finally payable, then every
  trace line under its kind — income, exemptions, deductions, tax, relief, rounding and so on — with its sentence, rule
  and figure, and one disclaimer naming the year's Act, Finance Act and Rules. A line whose rule is not verified
  against a primary source says "Not verified", but only where the rule's text is still the one the computation read;
  where it has changed, or was not recorded, the line says so and states no status. If the rule data has been updated
  since, the first page says so, naming the versions then and now. 400 where the account holds no such receipt, or the
  profile is held for erasure; the read is recorded in the access log.
