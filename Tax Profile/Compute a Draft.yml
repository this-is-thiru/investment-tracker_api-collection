info:
  name: Compute a Draft
  type: http
  seq: 2

http:
  method: POST
  url: "{{INVESTMENT_TRACKER_SERVICE}}/tax/user/:email/drafts/:draftId/compute"
  params:
    - name: email
      value: "{{EMAIL}}"
      type: path
    - name: draftId
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "regime": "NEW_TAX_REGIME"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Computes the draft under the regime given and stores the computation. Each line of tax.trace carries in and out (the
  line's figures, where they are money) and explanation (F37, W-116): the line in plain language — what the figure is,
  which limit set it and that raising the other limits alone would not change it — from the pack's content layer
  (content/explanations.json). A rule with no sentence yet shows its rule id; W-325 writes the rest.
