info:
  name: Computations of a Profile
  type: http
  seq: 18

http:
  method: GET
  url: "{{INVESTMENT_TRACKER_SERVICE}}/tax/user/:email/profiles/:profileId/computations"
  params:
    - name: email
      value: "{{EMAIL}}"
      type: path
    - name: profileId
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Every stored computation of the profile, across its drafts and years, newest first (W-123b): receipt, taxYear,
  draftLabel, revision, regime and computedAt (UTC; absent for one stored before W-123b, listed last). Take each one's
  PDF report by its receipt — the copy to keep before asking for the profile to be erased. Each row's read is recorded
  in the access log. 400 where the profile is not this account's or is held for erasure.
