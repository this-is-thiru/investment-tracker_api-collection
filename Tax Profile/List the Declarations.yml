info:
  name: List the Declarations
  type: http
  seq: 5

http:
  method: GET
  url: "{{INVESTMENT_TRACKER_SERVICE}}/tax/user/:email/declarations/:taxYear"
  params:
    - name: email
      value: "{{EMAIL}}"
      type: path
    - name: taxYear
      value: "2026"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  The questions the year's return asks that the engine cannot compute (W-090a2): r.164(3) and (6) of the Income-tax Rules, 2026, thirteen for 2026. Each row gives its code, the question, its answerKind (YES_NO or AMOUNT) and the clause that asks it. A year with no rule pack, or none yet read, lists none. Answer them with "Answer the Declarations".
