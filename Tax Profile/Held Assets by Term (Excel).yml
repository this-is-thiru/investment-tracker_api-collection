info:
  name: Held Assets by Term (Excel)
  type: http
  seq: 8

http:
  method: GET
  url: "{{INVESTMENT_TRACKER_SERVICE}}/tax/user/:email/profiles/:profileId/held-assets/excel"
  params:
    - name: email
      value: "{{EMAIL}}"
      type: path
    - name: profileId
      value: "<profile id from Create a Profile>"
      type: path
    - name: asOf
      value: "2026-11-06"
      type: query
    - name: term
      value: "LONG_TERM"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  The same answer as "Held Assets by Term", as a workbook (W-262): sheet LOTS with a row per lot and sheet TOTALS with a row per stock. Takes the same asOf and term. The file is named held-assets-<asOf>.xlsx.
