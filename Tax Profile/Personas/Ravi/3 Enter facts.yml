info:
  name: 3 Enter facts
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{INVESTMENT_TRACKER_SERVICE}}/tax/user/:email/drafts/:draftId"
  params:
    - name: email
      value: "{{EMAIL}}"
      type: path
    - name: draftId
      value: ""
      type: path
  headers:
    - name: If-Match
      value: '"rev-0"'
  body:
    type: json
    data: |-
      [
        {
          "op": "add",
          "path": "/entered/employments/-",
          "value": {
            "components": [
              {
                "code": {
                  "value": "BASIC"
                },
                "annualAmount": {
                  "amountInRupees": 1120000
                }
              },
              {
                "code": {
                  "value": "HRA"
                },
                "annualAmount": {
                  "amountInRupees": 560000
                }
              },
              {
                "code": {
                  "value": "SPECIAL_ALLOWANCE"
                },
                "annualAmount": {
                  "amountInRupees": 985600
                }
              },
              {
                "code": {
                  "value": "EMPLOYEE_PF"
                },
                "annualAmount": {
                  "amountInRupees": 134400
                }
              }
            ],
            "termsIncludeDearnessAllowance": false,
            "employerKind": "OTHER",
            "dearnessAllowanceCountsForRetirement": false,
            "companyEmployer": null
          }
        },
        {
          "op": "add",
          "path": "/entered/tenancies/-",
          "value": {
            "occupied": {
              "from": "2026-04-01",
              "to": "2027-03-31"
            },
            "location": "BENGALURU",
            "ownedByAssessee": false,
            "rentPaid": {
              "amountInRupees": 504000
            }
          }
        },
        {
          "op": "add",
          "path": "/entered/employerContributions/-",
          "value": {
            "employment": 0,
            "fund": "RECOGNISED_PROVIDENT_FUND",
            "amount": {
              "amountInRupees": 134400
            }
          }
        },
        {
          "op": "replace",
          "path": "/filing/dueDate",
          "value": "2027-07-31"
        }
      ]
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Send once: a second send adds the lists again. If-Match is the new draft's revision, rev-0. The due date is an input the computation asks for, not a statement of the law.
