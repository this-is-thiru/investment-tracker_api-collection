info:
  name: 1 Create profile
  type: http
  seq: 1

http:
  method: POST
  url: "{{INVESTMENT_TRACKER_SERVICE}}/tax/user/:email/profiles"
  params:
    - name: email
      value: "{{EMAIL}}"
      type: path
  body:
    type: json
    data: |-
      {
        "name": "Ravi",
        "pan": "AAAPR1111A",
        "kind": "INDIVIDUAL",
        "dateOfBirth": "1995-09-30",
        "residentialStatus": "RESIDENT",
        "holdsPortfolio": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Send the requests in order, once, on a new draft; copy profileId and draftId along. PR-1, 31, Bengaluru, CTC 28,00,000. His listed-equity gains are not here: a draft holds no gains, they come from the portfolio (W-241a). Bill: new regime 3,71,467.20; old regime 4,56,830.40.
  
  A PAN is registered once per database: if this one is taken, change it to another of the form AAAAA9999A.
