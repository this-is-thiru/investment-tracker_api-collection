info:
  name: 3 Enter facts
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{INVESTMENT_TRACKER_SERVICE}}/tax/user/:email/drafts/:draftId"
  params:
    - name: email
      value: "{{EMAIL}}"
      type: path
    - name: draftId
      value: ""
      type: path
  headers:
    - name: If-Match
      value: '"rev-0"'
  body:
    type: json
    data: |-
      [
        {
          "op": "add",
          "path": "/entered/employments/-",
          "value": {
            "components": [
              {
                "code": {
                  "value": "BASIC"
                },
                "annualAmount": {
                  "amountInRupees": 4575000
                }
              }
            ],
            "termsIncludeDearnessAllowance": false,
            "employerKind": "OTHER",
            "dearnessAllowanceCountsForRetirement": false,
            "companyEmployer": null
          }
        },
        {
          "op": "replace",
          "path": "/filing/dueDate",
          "value": "2027-07-31"
        }
      ]
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Send once: a second send adds the lists again. If-Match is the new draft's revision, rev-0. The due date is an input the computation asks for, not a statement of the law.
