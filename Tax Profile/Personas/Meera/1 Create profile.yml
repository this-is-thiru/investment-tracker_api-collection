info:
  name: 1 Create profile
  type: http
  seq: 1

http:
  method: POST
  url: "{{INVESTMENT_TRACKER_SERVICE}}/tax/user/:email/profiles"
  params:
    - name: email
      value: "{{EMAIL}}"
      type: path
  body:
    type: json
    data: |-
      {
        "name": "Meera",
        "pan": "AAAPM4444D",
        "kind": "INDIVIDUAL",
        "dateOfBirth": "1985-06-15",
        "residentialStatus": "RESIDENT",
        "holdsPortfolio": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Send the requests in order, once, on a new draft; copy profileId and draftId along. PR-4, high earner, basic pay 45,75,000 and a long-term gain on listed equity of 5,49,739.28 after charges, so her total income is just above 50,00,000: the surcharge applies and its marginal relief binds. Bill: new regime 10,58,627.06; old regime 13,26,427.06.
  
  Use an account of this persona's own: only one profile per account may hold the portfolio, and the trades are read from the account's portfolio. Seed the rate cards first.
  
  A PAN is registered once per database: if this one is taken, change it to another of the form AAAAA9999A.
