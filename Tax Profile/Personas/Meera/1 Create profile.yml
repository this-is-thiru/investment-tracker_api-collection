info:
  name: 1 Create profile
  type: http
  seq: 1

http:
  method: POST
  url: "{{INVESTMENT_TRACKER_SERVICE}}/tax/user/:email/profiles"
  params:
    - name: email
      value: "{{EMAIL}}"
      type: path
  body:
    type: json
    data: |-
      {
        "name": "Meera",
        "pan": "AAAPM4444D",
        "kind": "INDIVIDUAL",
        "dateOfBirth": "1985-06-15",
        "residentialStatus": "RESIDENT",
        "holdsPortfolio": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Send the requests in order, once, on a new draft; copy profileId and draftId along. PR-4, high earner, basic pay 45,75,000. Her long-term gain is not here (W-241a), so she stays below 50,00,000 and shows no surcharge until it is. Bill: new regime 9,67,200; old regime 12,16,800.
  
  A PAN is registered once per database: if this one is taken, change it to another of the form AAAAA9999A.
