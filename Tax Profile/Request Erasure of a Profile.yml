info:
  name: Request Erasure of a Profile
  type: http
  seq: 3

http:
  method: POST
  url: "{{INVESTMENT_TRACKER_SERVICE}}/tax/user/:email/profiles/:profileId/erasure"
  params:
    - name: email
      value: "{{EMAIL}}"
      type: path
    - name: profileId
      value: "<profile id from Create a Profile>"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Take your copy first: once asked, the profile cannot be read. List its computations
  (`GET /tax/user/{email}/profiles/{profileId}/computations`) and take each one's PDF report by its receipt
  (`GET /tax/user/{email}/computations/{receipt}/report`); read its drafts and revisions too (W-247 C2a, D-477, W-123b).
